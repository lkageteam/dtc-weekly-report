name: Rapport hebdomadaire DTC

on:
  # weekly-report : déclenché par l'Apps Script (payload = données DÉJÀ calculées) → envoie le mail.
  # weekly-report-preview : déclenché manuellement pour vérifier un rendu → n'envoie PAS le mail.
  # (on distingue par le TYPE d'événement, pas par un booléen dans le payload : les expressions
  #  GitHub Actions coercent `null` et `false` à la même valeur en comparaison lâche, donc un test
  #  du genre `client_payload.sendMail != false` est TOUJOURS vrai-négatif quand le champ est absent —
  #  piège vécu : un vrai run de production a silencieusement sauté l'envoi du mail à cause de ça.)
  repository_dispatch:
    types: [weekly-report, weekly-report-preview]
  # Lancement manuel (re-rendu) — nécessite des données déjà calculées dans le payload
  workflow_dispatch:

# DEUX PRODUCTEURS DISPATCHENT ICI, ET ILS NE SE VOIENT PAS (2026-08-17) :
# `appscript/compute_and_trigger.gs` (dédoublonné par LAST_SENT_WEEK) et
# `lka-unified/pipelines/dtc_weekly` (dédoublonné en MySQL). Le garde-fou qui
# les rend compatibles est la clé d'idempotence PAR PÉRIODE de
# `scripts/etat_envois.js`, posée ici — au point de livraison, seul endroit par
# où les deux passent. Le groupe de concurrence sérialise les deux dispatches
# pour que le second lise bien l'état écrit par le premier ; sans lui, les deux
# runs liraient un état vide en parallèle et la clé ne protégerait de rien.
concurrency:
  group: weekly-report-envoi
  cancel-in-progress: false

permissions:
  contents: write   # inscrire l'envoi dans state/envois_hebdo.json

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4

      # ── UN SEUL PRODUCTEUR, DEPUIS LE 2026-09-24 ──────────────────────────
      # `appscript/compute_and_trigger.gs` (lié au classeur CLASSEMENT_TSA)
      # dispatchait ici chaque lundi 8h/9h/10h, sans `producteur`. Il a envoyé
      # les Semaines 13 et 14 AVANT le pipeline, avec les montants BA DÉCLARÉS
      # et, pour la 14, l'ancienne découpe POS ven→jeu (« 11 au 17 septembre »).
      # Retrait décidé par le propriétaire. Un script lié ne se supprime pas à
      # distance : tant qu'il n'est pas effacé dans l'éditeur, c'est CE refus
      # qui l'empêche d'écrire à la direction — et un run ROUGE qui le signale.
      - name: Refuser tout autre producteur que lka-unified
        if: ${{ github.event.action == 'weekly-report' }}
        env:
          PRODUCTEUR: ${{ github.event.client_payload.producteur }}
        run: |
          if [ "$PRODUCTEUR" != "lka-unified/dtc_weekly" ]; then
            echo "❌ producteur « ${PRODUCTEUR:-inconnu} » refusé — seul lka-unified/dtc_weekly envoie ce rapport."
            echo "   Si c'est l'ancien Apps Script : il n'a pas été supprimé de l'éditeur du classeur CLASSEMENT_TSA."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: pip install -r scripts/requirements.txt

      - name: Écrire les données calculées (payload Apps Script)
        env:
          REPORT: ${{ toJSON(github.event.client_payload.report) }}
        run: |
          printf '%s' "$REPORT" > inputs/report.json
          if [ ! -s inputs/report.json ] || [ "$(cat inputs/report.json)" = "null" ]; then
            echo "❌ Aucune donnée dans le payload. Déclenche via l'Apps Script (buildAndTriggerReport)."
            exit 1
          fi
          node -e "JSON.parse(require('fs').readFileSync('inputs/report.json','utf8')); console.log('✓ report.json valide')"

      - name: Générer le graphique Week-over-week (matplotlib)
        run: python scripts/gen_wow_chart.py inputs/report.json assets/tmp/wow_chart.png

      - name: Générer le rapport (.pptx)
        env:
          INPUT_DIR: inputs
          OUT_DIR: outputs
          WOW_CHART_PNG: assets/tmp/wow_chart.png
        run: node scripts/progress_report_dtc_assisted.js

      - name: Identifier le fichier + la semaine
        id: f
        env:
          CLE: ${{ github.event.client_payload.cle }}
        run: |
          echo "file=$(ls outputs/*.pptx | head -1)" >> "$GITHUB_OUTPUT"
          echo "week=$(node -e 'process.stdout.write(require("./inputs/report.json").label||"")')" >> "$GITHUB_OUTPUT"
          # La clé d'idempotence est la PÉRIODE et sa COUVERTURE
          # (« Semaine 14 · POS →2026-09-19 sans 2026-09-17 · BA complet »),
          # fournie par le producteur depuis le 2026-09-24 : une semaine part
          # une fois PAR ÉTAT DES DONNÉES, jamais deux fois dans le même état.
          # À défaut, la période seule, comme avant.
          if [ -n "$CLE" ]; then
            echo "periode=$CLE" >> "$GITHUB_OUTPUT"
          else
            echo "periode=$(node -e 'process.stdout.write(require("./inputs/report.json").semaine||"")')" >> "$GITHUB_OUTPUT"
          fi

      # Le rapport a-t-il DÉJÀ été envoyé pour cette période, quel que soit le
      # producteur qui a dispatché ? `check` sort 1 si oui — d'où `|| echo`,
      # sinon l'étape ferait échouer le job sur un cas parfaitement normal.
      - name: Contrôler l'idempotence de la période
        id: idem
        run: |
          if node scripts/etat_envois.js check "${{ steps.f.outputs.periode }}"; then
            echo "envoyer=true" >> "$GITHUB_OUTPUT"
          else
            echo "envoyer=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Archiver le .pptx (téléchargeable depuis le run)
        uses: actions/upload-artifact@v4
        with:
          name: rapport-dtc
          path: outputs/*.pptx
          if-no-files-found: error

      # Envoi par mail via l'API Gmail (OAuth) — actif si le secret existe ET si l'événement
      # déclencheur est bien "weekly-report" (production), pas "weekly-report-preview" (vérification manuelle).
      - name: Envoyer par mail à g.fondzefe@lkaservices.com
        id: mail
        if: ${{ env.GMAIL_TOKEN_JSON != '' && github.event.action == 'weekly-report' && steps.idem.outputs.envoyer == 'true' }}
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          MAIL_FILE: ${{ steps.f.outputs.file }}
          MAIL_WEEK: ${{ steps.f.outputs.week }}
          MAIL_VERSION: ${{ github.event.client_payload.version }}
          MAIL_AVERTISSEMENT: ${{ github.event.client_payload.avertissement }}
          MAIL_TO: g.fondzefe@lkaservices.com
        run: node scripts/send_mail.js

      # ENVOYER D'ABORD, MARQUER ENSUITE — même ordre que le tronc
      # (`verifier_et_lancer.py`) et pour la même raison : si le mail échoue,
      # rien n'est inscrit et le prochain dispatch retente. L'inverse bloquerait
      # tout renvoi après un envoi raté.
      - name: Inscrire l'envoi (clé d'idempotence par période)
        if: ${{ steps.mail.outcome == 'success' }}
        env:
          DTC_PRODUCTEUR: ${{ github.event.client_payload.producteur || 'inconnu' }}
        run: |
          node scripts/etat_envois.js mark "${{ steps.f.outputs.periode }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/envois_hebdo.json
          git commit -m "chore(envois): ${{ steps.f.outputs.periode }} envoyee (producteur: ${DTC_PRODUCTEUR})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Un run vert qui n'a rien envoyé doit le DIRE. C'est le défaut qui a fait
      # sauter un envoi en silence (cf. l'en-tête `on:` de ce fichier).
      - name: Résumé
        if: always()
        run: |
          {
            echo "### Rapport DTC — ${{ steps.f.outputs.periode }}"
            echo ""
            echo "- événement : \`${{ github.event.action || github.event_name }}\`"
            echo "- producteur : \`${{ github.event.client_payload.producteur || 'inconnu' }}\`"
            echo "- mail : \`${{ steps.mail.outcome || 'non tenté' }}\`"
            if [ "${{ steps.idem.outputs.envoyer }}" != "true" ]; then
              echo "- ⚠️ **période déjà envoyée** — second mail volontairement supprimé (state/envois_hebdo.json)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
