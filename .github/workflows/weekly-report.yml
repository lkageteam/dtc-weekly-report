name: Rapport hebdomadaire DTC

on:
  # Déclenché par l'Apps Script : payload = données DÉJÀ calculées (client_payload.report)
  repository_dispatch:
    types: [weekly-report]
  # Lancement manuel (re-rendu) — nécessite des données déjà calculées dans le payload
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Écrire les données calculées (payload Apps Script)
        env:
          REPORT: ${{ toJSON(github.event.client_payload.report) }}
        run: |
          printf '%s' "$REPORT" > inputs/report.json
          if [ ! -s inputs/report.json ] || [ "$(cat inputs/report.json)" = "null" ]; then
            echo "❌ Aucune donnée dans le payload. Déclenche via l'Apps Script (buildAndTriggerReport)."
            exit 1
          fi
          node -e "JSON.parse(require('fs').readFileSync('inputs/report.json','utf8')); console.log('✓ report.json valide')"

      - name: Générer le rapport (.pptx)
        env:
          INPUT_DIR: inputs
          OUT_DIR: outputs
        run: node scripts/progress_report_dtc_assisted.js

      - name: Identifier le fichier généré
        id: f
        run: echo "file=$(ls outputs/*.pptx | head -1)" >> "$GITHUB_OUTPUT"

      - name: Archiver le .pptx (téléchargeable depuis le run)
        uses: actions/upload-artifact@v4
        with:
          name: rapport-dtc
          path: outputs/*.pptx
          if-no-files-found: error

      # Optionnel : envoi par mail (actif uniquement si le secret SMTP_HOST existe)
      - name: Envoyer par mail
        if: ${{ env.SMTP_HOST != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "Rapport hebdomadaire DTC Assisted"
          to: ${{ secrets.MAIL_TO }}
          from: LKA DTC <${{ secrets.SMTP_USER }}>
          body: "Rapport DTC Assisted généré automatiquement par la chaîne. Fichier en pièce jointe."
          attachments: ${{ steps.f.outputs.file }}
